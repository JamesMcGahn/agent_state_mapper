[project]
name = "agent-state-mapper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "James McGahn", email = "jmcgahn@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mssql-python>=1.17.0",
    "openpyxl>=3.1.5",
    "questionary>=2.1.1",
    "requests>=2.34.2",
]


[project.scripts]
start = "agent_state_mapper:main"

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"
[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
